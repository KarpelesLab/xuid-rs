[package]
name = "xuid-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Mark Karpeles"]
license = "BSD-3-Clause"
description = "Extended UUIDs: type-prefixed, base32-encoded UUIDs (Rust port of KarpelesLab/xuid)"
repository = "https://github.com/KarpelesLab/xuid"
documentation = "https://docs.rs/xuid-rs"
readme = "README.md"
keywords = ["uuid", "xuid", "identifier", "base32", "uuidv7"]
categories = ["data-structures", "encoding"]

[lib]
name = "xuid"
path = "src/lib.rs"

[dependencies]
uuid = { version = "1", features = ["v4", "v5", "v7"] }
data-encoding = "2"
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
serde_json = "1"

[features]
default = []
serde = ["dep:serde", "uuid/serde"]

[package.metadata.docs.rs]
all-features = true
